name: Daily Tennis AI Pipeline

on:
  schedule:
    # 06:23 UTC (07:23 CET) - Avant ouverture sessions Europe + clôture nuit Amériques
    - cron: "23 6 * * *"
    # 13:23 UTC (14:23 CET) - Milieu journée Europe + avant ouverture sessions Amériques
    - cron: "23 13 * * *"
    # 21:23 UTC (22:23 CET) - Fin soirée Europe + avant ouverture sessions Asie/Océanie
    - cron: "23 21 * * *"

  workflow_dispatch:

concurrency:
  group: tennis-ai-pipeline-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tennis-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout de la branche test_neon_4_high
        uses: actions/checkout@v4
        with:
          ref: test_neon_4_high
          fetch-depth: 0

      - name: Configuration de Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mise à jour ROI/CLV, analyse quotidienne et notification email
        env:
          TENNISINSIGHT_LOGIN: ${{ secrets.TENNISINSIGHT_LOGIN }}
          TENNISINSIGHT_PASSWORD: ${{ secrets.TENNISINSIGHT_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py --with-update-results --soft-fail-on-outage

      - name: Export du dump SQL léger et sauvegarde sur test_neon_4_high
        if: always()
        run: |
          if [ ! -f tennis_ai.db ]; then
            echo "Base tennis_ai.db absente, aucun dump à exporter."
            exit 0
          fi
          python -c "from core.database import TennisDatabase; TennisDatabase().export_sql_dump()"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tennis_ai_dump.sql
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update tennis_ai_dump.sql [skip ci]"
            git pull --rebase --autostash origin test_neon_4_high
            git push origin HEAD:test_neon_4_high
          else
            echo "Aucune nouvelle donnée à commiter."
          fi

      - name: Archivage des rapports Excel et logs (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-ai-reports-${{ github.run_number }}
          path: |
            Paris_Alpha_5_Plus.xlsx
            logs/tennis_ai.log
          if-no-files-found: ignore
          retention-days: 14