name: Daily Tennis AI Pipeline

on:
  schedule:
    # 06:23 UTC (07:23 CET) - Avant ouverture sessions Europe + clôture nuit Amériques
    - cron: "23 6 * * *"
    # 13:23 UTC (14:23 CET) - Milieu journée Europe + avant ouverture sessions Amériques
    - cron: "23 13 * * *"
    # 21:23 UTC (22:23 CET) - Fin soirée Europe + avant ouverture sessions Asie/Océanie
    - cron: "23 21 * * *"

  workflow_dispatch:

concurrency:
  group: tennis-ai-pipeline-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tennis-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout de la branche déclenchante
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Configuration de Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Installation des dépendances
        id: dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mise à jour des résultats en attente (ROI & CLV)
        timeout-minutes: 5
        env:
          TENNISINSIGHT_LOGIN: ${{ secrets.TENNISINSIGHT_LOGIN }}
          TENNISINSIGHT_PASSWORD: ${{ secrets.TENNISINSIGHT_PASSWORD }}
        run: python main.py --update-results

      - name: Exécution de l'analyse et notification email
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 12
        env:
          TENNISINSIGHT_LOGIN: ${{ secrets.TENNISINSIGHT_LOGIN }}
          TENNISINSIGHT_PASSWORD: ${{ secrets.TENNISINSIGHT_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py

      - name: Export de l'état même après une erreur de traitement
        id: snapshot
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.database import TennisDatabase

          if not Path("tennis_ai.db").is_file():
              raise RuntimeError("Aucune base à sauvegarder : le traitement n'a pas démarré.")
          db = TennisDatabase()
          db.export_sql_dump()
          db.export_bets_to_excel()
          PY

      - name: Conserver une copie récupérable même si le push échoue
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: tennis-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tennis_ai_dump.sql
            Paris_Alpha_5_Plus.xlsx
            tennis_ai.db
            tennis_ai.db-wal
            tennis_ai.db-shm
          if-no-files-found: error
          retention-days: 30

      - name: Sauvegarde sur la branche déclenchante
        if: ${{ always() && steps.snapshot.outcome == 'success' && github.ref_type == 'branch' }}
        timeout-minutes: 2
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tennis_ai_dump.sql Paris_Alpha_5_Plus.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update tennis_ai_dump.sql & tracking excel [skip ci]"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "Aucune nouvelle donnée à commiter."
          fi
